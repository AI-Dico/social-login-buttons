<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소셜 로그인 버튼 — 실측 미리보기</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1d1d1b;--sub:#6b6b66;--line:#e2e1dc;--accent:#2f5bd3}
body.dark{--bg:#121212;--panel:#1c1c1c;--ink:#ececec;--sub:#9a9a95;--line:#2e2e2e;--accent:#8fb0ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.ctl{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.ctl h1{font-size:17px}
.ctl .note{font-size:12px;color:var(--sub);margin:4px 0 0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>label{font-size:12px;font-weight:600;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.pick{display:flex;align-items:center;gap:8px;font-size:13px}
.pick span{width:28px;color:var(--sub)}
.pick input[type=color]{width:36px;height:28px;border:1px solid var(--line);border-radius:6px;padding:0;background:none;cursor:pointer}
.pick input[type=text]{width:88px;font:12px ui-monospace,Menlo,monospace;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink)}
.copy.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:0}
.pv{display:none;white-space:pre-wrap;font:11px/1.5 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:320px;overflow:auto;margin:0}
.pv.on{display:block}
.copy{margin-top:auto;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.stage{padding:28px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:375px;background:var(--scr);border-radius:28px;padding:44px 24px 32px;box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.08)}
.phone{--scr:#ffffff}
body.dark .phone{--scr:#000000}
.phone h2{font-size:22px;color:var(--ink);margin-bottom:6px}
.phone p.lead{font-size:14px;color:var(--sub);margin:0 0 28px}
.stack{display:flex;flex-direction:column;gap:10px}
.icons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.narrow{display:flex;flex-direction:column;gap:10px;align-items:center}
.cell{display:flex;flex-direction:column;gap:4px}
.narrow .cell{align-items:center}
.icons .cell{align-items:center;text-align:center}
.spec{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub)}
.spec .warn{color:#c2410c}
body.dark .spec .warn{color:#fb923c}
.spec .info{color:#2563eb}
body.dark .spec .info{color:#93c5fd}
.ph{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.spec .lic{color:#7c3aed}
body.dark .spec .info{color:#2563eb}
body.dark .spec .info{color:#93c5fd}
.ph{display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.spec .lic{color:#c4b5fd}
.hide-spec .spec{display:none}
/* button */
.slb{position:relative;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Roboto,sans-serif;white-space:nowrap;overflow:hidden;padding:0}
.slb .logo{flex:none;display:block}
.slb.left .logo{position:absolute;top:50%;transform:translateY(-50%)}
.slb .lbl{display:block}
.slb.icon{padding:0}
.grid{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px 16px;grid-template-columns:70px repeat(4,max-content);align-items:start;font-size:12px}
.grid .cell{max-width:260px}
.grid .slb{width:max-content;flex:none}
.slb{flex:none}
.grid .hd{font-weight:600;color:var(--sub);text-align:center}
.grid .rh{font-weight:600}
.legend{font-size:12px;color:var(--sub);max-width:420px}
.legend b{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<aside class="ctl" id="ctl"></aside>
<main class="stage" id="stage"></main>
</div>

function render(skipCtl){
  document.body.classList.toggle('dark',S.theme==='dark');
  document.body.classList.toggle('hide-spec',!S.spec);
  const st=document.getElementById('stage');st.innerHTML='';
  if(S.view==='grid'){st.appendChild(renderGrid())}else{st.appendChild(renderPhone());
    const lg=document.createElement('div');lg.className='legend';
    lg.innerHTML=`<p><b>ℹ 공식 기본</b> — 고른 모서리가 그 회사 공식 기본값과 다를 때 참고로 표시. 고른 값은 모든 버튼에 똑같이 적용된다.</p><p><b>⛔ 로고 직접 받기</b> — 재배포 금지 로고(데모에서는 🍎 로 대신 표시). 라이브러리에는 넣지 않는다. Apple 로고는 <a href="https://developer.apple.com/design/resources/#sign-in-with-apple" style="color:inherit">Apple Design Resources</a> 에서 직접 받는다.</p><p><b>단색 토큰</b> — 흰색 ${JSON.stringify(TONE.white[S.theme])} · 검정 ${JSON.stringify(TONE.black[S.theme])}${S.tone==='custom'?` · 직접 지정 ${JSON.stringify(customTone())}`:''}</p><p>값 출처: <a href="https://github.com/AI-Dico/social-login-buttons/blob/main/docs/research/official-guides-2026-11-05.md" style="color:inherit">official-guides-2026-11-05.md</a></p>`;st.appendChild(lg)}
  location.hash=new URLSearchParams({lang:S.lang,target:S.target,purpose:S.purpose,layout:S.layout,corner:S.corner,height:S.height,font:S.font,tone:S.tone,stack:S.stack,cbg:S.cbg,cfg:S.cfg,logo:S.logo,theme:S.theme,align:S.align,alt:S.alt?1:0,spec:S.spec?1:0,view:S.view}).toString();
  if(!skipCtl)renderCtl();else updateContrast();
}
function seg(key,label,opts){
  return `<div class="grp"><label>${label}</label><div class="seg">${opts.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${String(S[key])===String(v)?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function updateContrast(){const el=document.getElementById('cr');if(!el)return;const r=contrast(S.cbg,S.cfg);
  el.innerHTML=`글자 대비 ${r.toFixed(2)}:1 — ${r>=4.5?'✓ WCAG AA 통과':r>=3?'△ 큰 글자만 AA':'✗ 대비 부족'}`+(customTone().border?' · 화면 배경과 비슷해 테두리 자동':'')}
function renderCtl(){
  const c=document.getElementById('ctl');
  c.innerHTML=`<div><h1>소셜 로그인 버튼 실측 미리보기</h1><p class="note">공식 가이드·애셋에서 잰 값으로 그린 버튼. 조건을 바꿔 보고 「선택 JSON 복사」로 넘겨 주세요.</p></div>`+
  seg('view','보기',[['phone','화면'],['grid','모서리 비교표']])+
  seg('lang','언어',[['ko','한국어'],['en','English']])+
  seg('target','대상',[['web','웹'],['ios','iOS'],['android','Android']])+
  seg('purpose','문구',[['login','로그인'],['continue','계속하기·시작하기'],['signup','가입']])+
  seg('layout','형태',[['full','세로 전체 폭'],['narrow','좁은 폭'],['icons','아이콘만'],['mixed','주 버튼+아이콘']])+
  seg('align','정렬(전체 폭)',[['center','가운데'],['left','로고 왼쪽']])+
  seg('corner','모서리',CORNERS)+
  seg('height','높이',[['official','회사별 공식'],['44','44'],['48','48'],['52','52'],['56','56']])+
  seg('font','글자 크기',[['unified','모두 같게'],['brand','회사별 공식']])+
  seg('theme','테마',[['light','라이트'],['dark','다크']])+
  seg('tone','버튼 색',[['brand','브랜드색'],['white','모두 흰색'],['black','모두 검정'],['custom','직접 지정']])+
  (S.tone==='custom'?`<div class="grp"><label>직접 지정 색</label>
   <div class="pick"><span>배경</span><input type="color" data-c="cbg" value="${S.cbg}"><input type="text" data-t="cbg" value="${S.cbg}" maxlength="7"></div>
   <div class="pick"><span>글자</span><input type="color" data-c="cfg" value="${S.cfg}"><input type="text" data-t="cfg" value="${S.cfg}" maxlength="7"></div>
   <div class="note" id="cr"></div></div>`:'')+
  seg('logo','로고 색',[['brand','브랜드'],['mono','단색']])+
  seg('alt','대체 스타일(브랜드색일 때)',[[false,'기본'],[true,'흰·중립·외곽선']])+
  seg('spec','실측값 표시',[[true,'보이기'],[false,'숨기기']])+
  `<div class="grp"><label>회사</label><div class="chk">${S.order.map(i=>`<label><input type="checkbox" data-on="${i}" ${S.on[i]?'checked':''}> ${T[i].name}</label>`).join('')}</div></div>`+
  seg('stack','대상 스택(프롬프트)',Object.entries(STACKS).map(([k,v])=>[k,k==='auto'?'자동':v.replace(/ \(.*\)/,'').replace('iOS ','').replace('Android Jetpack ','')]))+
  `<button class="copy" id="prompt">AI 프롬프트 복사</button><button class="copy alt" id="copy">선택 JSON 복사</button><pre id="pv" class="pv"></pre>`;
  c.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S[b.dataset.k]=v;render()});
  c.querySelectorAll('[data-on]').forEach(x=>x.onchange=()=>{S.on[x.dataset.on]=x.checked?1:0;render()});
  c.querySelectorAll('[data-c]').forEach(x=>x.oninput=()=>{S[x.dataset.c]=x.value.toUpperCase();const t=c.querySelector(`[data-t="${x.dataset.c}"]`);if(t)t.value=S[x.dataset.c];render(true)});
  c.querySelectorAll('[data-t]').forEach(x=>x.oninput=()=>{let v=x.value.trim();if(!v.startsWith('#'))v='#'+v;if(hexOk(v)){S[x.dataset.t]=v.toUpperCase();const p=c.querySelector(`[data-c="${x.dataset.t}"]`);if(p)p.value=S[x.dataset.t];render(true)}});
  updateContrast();
  c.querySelector('#prompt').onclick=()=>{const t=promptText();navigator.clipboard?.writeText(t).catch(()=>{});const pv=c.querySelector('#pv');pv.textContent=t;pv.classList.add('on');c.querySelector('#prompt').textContent='복사됨 — 아래 미리보기'};
  c.querySelector('#copy').onclick=()=>{const j=JSON.stringify({board:'slb-preview',...S},null,2);navigator.clipboard?.writeText(j);console.log(j);c.querySelector('#copy').textContent='복사됨'};
}
render();
</script>
</body>
</html>
