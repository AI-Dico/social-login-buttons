<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>소셜 로그인 버튼 — 실측 미리보기</title>
<style>
:root{--bg:#f4f4f2;--panel:#fff;--ink:#1d1d1b;--sub:#6b6b66;--line:#e2e1dc;--accent:#2f5bd3}
body.dark{--bg:#121212;--panel:#1c1c1c;--ink:#ececec;--sub:#9a9a95;--line:#2e2e2e;--accent:#8fb0ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;overflow-wrap:break-word}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.ctl{background:var(--panel);border-right:1px solid var(--line);padding:20px 18px;display:flex;flex-direction:column;gap:16px}
.ctl h1{font-size:17px}
.ctl .note{font-size:12px;color:var(--sub);margin:4px 0 0}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>label{font-size:12px;font-weight:600;color:var(--sub)}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chk{display:flex;flex-wrap:wrap;gap:10px;font-size:13px}
.copy{margin-top:auto;border:0;background:var(--accent);color:#fff;font:inherit;font-weight:600;padding:10px;border-radius:8px;cursor:pointer;white-space:nowrap}
.stage{padding:28px;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:375px;background:var(--scr);border-radius:28px;padding:44px 24px 32px;box-shadow:0 0 0 1px var(--line),0 12px 30px rgba(0,0,0,.08)}
.phone{--scr:#ffffff}
body.dark .phone{--scr:#000000}
.phone h2{font-size:22px;color:var(--ink);margin-bottom:6px}
.phone p.lead{font-size:14px;color:var(--sub);margin:0 0 28px}
.stack{display:flex;flex-direction:column;gap:10px}
.icons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.narrow{display:flex;flex-direction:column;gap:10px;align-items:center}
.cell{display:flex;flex-direction:column;gap:4px}
.narrow .cell{align-items:center}
.icons .cell{align-items:center;text-align:center}
.spec{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--sub)}
.spec .warn{color:#c2410c}
body.dark .spec .warn{color:#fb923c}
.spec .info{color:#2563eb}
body.dark .spec .info{color:#93c5fd}
.ph{display:inline-flex;align-items:center;justify-content:center;border:1.5px dashed currentColor;border-radius:4px;font-size:10px;opacity:.75;flex:none}
.spec .lic{color:#7c3aed}
body.dark .spec .info{color:#2563eb}
body.dark .spec .info{color:#93c5fd}
.ph{display:inline-flex;align-items:center;justify-content:center;border:1.5px dashed currentColor;border-radius:4px;font-size:10px;opacity:.75;flex:none}
.spec .lic{color:#c4b5fd}
.hide-spec .spec{display:none}
/* button */
.slb{position:relative;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Roboto,sans-serif;white-space:nowrap;overflow:hidden;padding:0}
.slb .logo{flex:none;display:block}
.slb.left .logo{position:absolute;top:50%;transform:translateY(-50%)}
.slb .lbl{display:block}
.slb.icon{padding:0}
.grid{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:12px 16px;grid-template-columns:70px repeat(4,max-content);align-items:start;font-size:12px}
.grid .cell{max-width:260px}
.grid .slb{width:max-content;flex:none}
.slb{flex:none}
.grid .hd{font-weight:600;color:var(--sub);text-align:center}
.grid .rh{font-weight:600}
.legend{font-size:12px;color:var(--sub);max-width:420px}
.legend b{color:var(--ink)}
</style>
</head>
<body>
<div class="app">
<aside class="ctl" id="ctl"></aside>
<main class="stage" id="stage"></main>
</div>

  lic:'공식 애셋 배포 · 재배포 조건 명시 없음', iconShape:'circle'},
 apple:{name:'Apple',radius:{official:6,min:0,max:999,docNote:'앱 버튼에 맞춰 조정 가능 · 각진·캡슐 허용'},
  style:{light:{bg:'#000000',fg:'#FFFFFF',logo:'#FFFFFF'},dark:{bg:'#FFFFFF',fg:'#000000',logo:'#000000'},
         alt_light:{bg:'#FFFFFF',fg:'#000000',logo:'#000000',border:'#000000'},alt_dark:{bg:'#FFFFFF',fg:'#000000',logo:'#000000'}},
  font:h=>Math.round(h*0.43), weight:500, minW:140,
  label:{ko:{login:'Apple로 로그인',continue:'Apple로 계속하기',signup:'Apple로 등록',short:'로그인'},en:{login:'Sign in with Apple',continue:'Continue with Apple',signup:'Sign up with Apple',short:'Sign in'}},
  lic:'⛔ 재배포 금지(Apple Design Resources 라이선스) → 사용자가 직접 내려받기', noRedistribute:true, iconShape:'square'},
 google:{name:'Google',radius:{official:4,min:4,max:999,docNote:'Square 4 · Pill 허용'},
  style:{light:{bg:'#FFFFFF',fg:'#1F1F1F',border:'#747775'},dark:{bg:'#131314',fg:'#E3E3E3',border:'#8E918F'},
         alt_light:{bg:'#F2F2F2',fg:'#1F1F1F'},alt_dark:{bg:'#F2F2F2',fg:'#1F1F1F'}},
  font:()=>14, logo:()=>20, weight:500,
  pad:{web:[12,10,12],android:[12,10,12],ios:[16,12,16]},
  label:{ko:{login:'Google 계정으로 로그인',continue:'Google 계정으로 계속하기',signup:'Google 계정으로 가입',short:'로그인'},en:{login:'Sign in with Google',continue:'Continue with Google',signup:'Sign up with Google',short:'Sign in'}},
  lic:'상표 · 명시 외 사용은 사전 동의 필요 [확인 필요]', iconShape:'square'}
};
const HEIGHT_OFFICIAL={kakao:46,naver:48,apple:44,google:{web:40,android:40,ios:44}};
const CORNERS=[['official','공식'],['0','각진 0'],['4','4'],['8','8'],['12','12'],['pill','알약']];
const S=Object.assign({lang:'ko',target:'ios',purpose:'login',layout:'full',corner:'official',height:'48',theme:'light',align:'center',alt:false,spec:true,order:['kakao','naver','apple','google'],on:{kakao:1,naver:1,apple:1,google:1},view:'phone'},
  Object.fromEntries(new URLSearchParams(location.hash.slice(1))));
['alt','spec'].forEach(k=>{if(typeof S[k]==='string')S[k]=S[k]==='1'||S[k]==='true'});

function logoSVG(id,size,color,opts={}){
  const ns='http://www.w3.org/2000/svg';
  if(id==='google'){const i=document.createElement('img');i.src=LOGOS.google_png;i.width=size;i.height=size;i.className='logo';i.alt='';return i}
  const L=id==='apple'?(opts.only?LOGOS.apple_only:LOGOS.apple_left):LOGOS[id];
  if(!L){const d=document.createElement('span');d.className='logo ph';d.title='Apple 로고는 재배포 금지 — Apple Design Resources 에서 직접 받아 넣으세요';d.textContent='⛔';
    const z=opts.only?Math.round(size*0.45):Math.round(size*0.42);d.style.width=z+'px';d.style.height=z+'px';if(!opts.only){d.style.margin='0 '+Math.round(size*0.12)+'px 0 '+Math.round(size*0.18)+'px'}return d}
  const s=document.createElementNS(ns,'svg');s.setAttribute('viewBox',L.vb);s.setAttribute('class','logo');
  if(id==='apple'&&!opts.only){s.setAttribute('height',size);s.setAttribute('width',size*31/44)}else{s.setAttribute('width',size);s.setAttribute('height',size)}
  const p=document.createElementNS(ns,'path');p.setAttribute('d',L.d);p.setAttribute('fill',color);
  if(L.g){const g=document.createElementNS(ns,'g');g.setAttribute('transform',L.g);g.appendChild(p);s.appendChild(g)}else s.appendChild(p);
  s.setAttribute('aria-hidden','true');return s;
}
function resolveRadius(id,h){
  // 고른 모서리를 모든 회사에 그대로 적용한다(디자인 일관성 우선). 공식 기본값과 다르면 정보 표시만.
  const R=T[id].radius;let r=S.corner==='official'?R.official:S.corner==='pill'?h/2:Math.min(+S.corner,h/2);
  const flag=(S.corner!=='official'&&r!==R.official)?`공식 기본 ${R.official}`:'';
  return{r,flag};
}
function heightFor(id){
  if(S.height==='official'){const o=HEIGHT_OFFICIAL[id];return typeof o==='object'?o[S.target]:o}
  return +S.height;
}
function styleFor(id){const st=T[id].style;const k=(S.alt&&st['alt_'+S.theme])?'alt_'+S.theme:S.theme;return st[k]}
function makeButton(id,mode){ // mode: full | narrow | icon
  const t=T[id],h=heightFor(id),st=styleFor(id),{r,flag}=resolveRadius(id,h);
  const b=document.createElement('button');b.className='slb';b.type='button';
  b.style.height=h+'px';b.style.background=st.bg;b.style.color=st.fg;
  b.style.borderRadius=(mode==='icon'&&S.corner==='pill'?'50%':r+'px');
  if(st.border)b.style.boxShadow=`inset 0 0 0 1px ${st.border}`;
  const lbl=t.label[S.lang][mode==='narrow'&&id==='kakao'?'short':S.purpose];
  b.setAttribute('aria-label',t.label[S.lang][S.purpose]);
  let fs=t.font(h),ls=0,specBits=[`h ${h}`,`r ${mode==='icon'&&S.corner==='pill'?'원':r}`];
  if(mode==='icon'){
    b.style.width=h+'px';b.classList.add('icon');
    let size=id==='kakao'?Math.round(h*0.46):id==='naver'?18:id==='google'?20:h;
    b.appendChild(logoSVG(id,size,st.logo||st.fg,{only:true}));specBits.push(`logo ${size}`);
  }else{
    const left=S.align==='left'&&mode==='full';
    let logoSize,el;
    if(id==='apple'){logoSize=h;el=logoSVG('apple',h,st.logo)}
    else if(id==='google'){logoSize=20;el=logoSVG('google',20)}
    else{logoSize=t.logo(h,left);el=logoSVG(id,logoSize,st.logo)}
    const span=document.createElement('span');span.className='lbl';span.textContent=lbl;
    span.style.fontSize=fs+'px';span.style.fontWeight=t.weight;span.style.lineHeight=(id==='google'?'20px':'1');
    if(id==='google'){const [pl,g,pr]=t.pad[S.target];b.style.padding=`0 ${pr}px 0 ${pl}px`;el.style.marginRight=g+'px';if(left){el.style.left=pl+'px'}specBits.push(`pad ${pl}/${g}/${pr}`)}
    else if(id==='apple'){if(!el.classList.contains('ph'))el.style.marginRight='0';b.style.paddingRight='12px';if(left)el.style.left='8px'}
    else{el.style.marginRight=t.gap+'px';if(left)el.style.left=t.padLeft+'px';b.style.padding='0 16px'}
    if(left)b.classList.add('left');
    b.append(el,span);
    if(mode==='full')b.style.width='100%';
    if(mode==='narrow'){b.style.minWidth=(t.minW||0)+'px'; if(id!=='google'&&id!=='apple')b.style.padding='0 20px'; if(id==='apple')b.style.padding='0 16px 0 4px'}
    specBits.push(`글자 ${fs}`,`logo ${logoSize}`);
  }
  const cell=document.createElement('div');cell.className='cell';cell.appendChild(b);
  const sp=document.createElement('div');sp.className='spec';
  sp.innerHTML=`${t.name} · ${specBits.join(' · ')}`+(flag?` · <span class="info">ℹ ${flag}</span>`:'')+(t.noRedistribute?` · <span class="lic">⛔ 로고 직접 받기</span>`:'');
  if(mode==='icon'){sp.title=sp.textContent;sp.innerHTML=`${t.name}<br>r ${S.corner==='pill'?'원':r}`+(flag?' <span class="info">ℹ</span>':'')+(t.noRedistribute?' <span class="lic">⛔</span>':'')}
  cell.appendChild(sp);return cell;
}
const TXT={ko:{h:'시작하기',p:'자주 쓰는 계정으로 3초 만에 가입하세요.',or:'또는'},en:{h:'Get started',p:'Sign up in seconds with an account you already use.',or:'or'}};
function renderPhone(){
  const ph=document.createElement('div');ph.className='phone';
  const tx=TXT[S.lang];ph.innerHTML=`<h2>${tx.h}</h2><p class="lead">${tx.p}</p>`;
  const ids=S.order.filter(i=>S.on[i]);
  if(S.layout==='full'){const w=document.createElement('div');w.className='stack';ids.forEach(i=>w.appendChild(makeButton(i,'full')));ph.appendChild(w)}
  if(S.layout==='narrow'){const w=document.createElement('div');w.className='narrow';ids.forEach(i=>w.appendChild(makeButton(i,'narrow')));ph.appendChild(w)}
  if(S.layout==='icons'){const w=document.createElement('div');w.className='icons';ids.forEach(i=>w.appendChild(makeButton(i,'icon')));ph.appendChild(w)}
  if(S.layout==='mixed'){const w=document.createElement('div');w.className='stack';w.appendChild(makeButton(ids[0],'full'));
    const or=document.createElement('div');or.className='spec';or.style.textAlign='center';or.style.margin='8px 0';or.textContent=tx.or;w.appendChild(or);
    const ic=document.createElement('div');ic.className='icons';ids.slice(1).forEach(i=>ic.appendChild(makeButton(i,'icon')));w.appendChild(ic);ph.appendChild(w)}
  return ph;
}
function renderGrid(){
  const g=document.createElement('div');g.className='grid';
  g.innerHTML='<div></div>'+S.order.map(id=>`<div class="hd">${T[id].name}</div>`).join('');
  const keep=S.corner;
  CORNERS.forEach(([c,lab])=>{const rh=document.createElement('div');rh.className='rh';rh.textContent=lab;g.appendChild(rh);
    S.order.forEach(id=>{S.corner=c;g.appendChild(makeButton(id,'narrow'))})});
  S.corner=keep;return g;
}
function render(){
  document.body.classList.toggle('dark',S.theme==='dark');
  document.body.classList.toggle('hide-spec',!S.spec);
  const st=document.getElementById('stage');st.innerHTML='';
  if(S.view==='grid'){st.appendChild(renderGrid())}else{st.appendChild(renderPhone());
    const lg=document.createElement('div');lg.className='legend';
    lg.innerHTML=`<p><b>ℹ 공식 기본</b> — 고른 모서리가 그 회사 공식 기본값과 다를 때 참고로 표시. 고른 값은 모든 버튼에 똑같이 적용된다.</p><p><b>⛔ 로고 직접 받기</b> — 재배포 금지 로고. 라이브러리에는 넣지 않는다. Apple 로고는 <a href="https://developer.apple.com/design/resources/#sign-in-with-apple" style="color:inherit">Apple Design Resources</a> 에서 직접 받는다.</p><p>값 출처: <a href="research/official-guides-2026-11-05.md" style="color:inherit">official-guides-2026-11-05.md</a></p>`;st.appendChild(lg)}
  location.hash=new URLSearchParams({lang:S.lang,target:S.target,purpose:S.purpose,layout:S.layout,corner:S.corner,height:S.height,theme:S.theme,align:S.align,alt:S.alt?1:0,spec:S.spec?1:0,view:S.view}).toString();
  renderCtl();
}
function seg(key,label,opts){
  return `<div class="grp"><label>${label}</label><div class="seg">${opts.map(([v,t])=>`<button data-k="${key}" data-v="${v}" class="${String(S[key])===String(v)?'on':''}">${t}</button>`).join('')}</div></div>`;
}
function renderCtl(){
  const c=document.getElementById('ctl');
  c.innerHTML=`<div><h1>소셜 로그인 버튼 실측 미리보기</h1><p class="note">공식 가이드·애셋에서 잰 값으로 그린 버튼. 조건을 바꿔 보고 「선택 JSON 복사」로 넘겨 주세요.</p></div>`+
  seg('view','보기',[['phone','화면'],['grid','모서리 비교표']])+
  seg('lang','언어',[['ko','한국어'],['en','English']])+
  seg('target','대상',[['web','웹'],['ios','iOS'],['android','Android']])+
  seg('purpose','문구',[['login','로그인'],['continue','계속하기·시작하기'],['signup','가입']])+
  seg('layout','형태',[['full','세로 전체 폭'],['narrow','좁은 폭'],['icons','아이콘만'],['mixed','주 버튼+아이콘']])+
  seg('align','정렬(전체 폭)',[['center','가운데'],['left','로고 왼쪽']])+
  seg('corner','모서리',CORNERS)+
  seg('height','높이',[['official','회사별 공식'],['44','44'],['48','48'],['52','52'],['56','56']])+
  seg('theme','테마',[['light','라이트'],['dark','다크']])+
  seg('alt','대체 스타일',[[false,'기본'],[true,'흰·중립·외곽선']])+
  seg('spec','실측값 표시',[[true,'보이기'],[false,'숨기기']])+
  `<div class="grp"><label>회사</label><div class="chk">${S.order.map(i=>`<label><input type="checkbox" data-on="${i}" ${S.on[i]?'checked':''}> ${T[i].name}</label>`).join('')}</div></div>`+
  `<button class="copy" id="copy">선택 JSON 복사</button>`;
  c.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{let v=b.dataset.v;if(v==='true')v=true;if(v==='false')v=false;S[b.dataset.k]=v;render()});
  c.querySelectorAll('[data-on]').forEach(x=>x.onchange=()=>{S.on[x.dataset.on]=x.checked?1:0;render()});
  c.querySelector('#copy').onclick=()=>{const j=JSON.stringify({board:'slb-preview',...S},null,2);navigator.clipboard?.writeText(j);console.log(j);c.querySelector('#copy').textContent='복사됨'};
}
render();
</script>
